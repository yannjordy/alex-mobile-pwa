<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alex</title>
<meta name="description" content="Alex - Assistant personnel intelligent">
<meta name="theme-color" content="#0f121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/icon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f121c;
  --surface:#1a1d27;
  --border:rgba(255,157,61,0.15);
  --amber:#ff9d3d;
  --amber-soft:#ffc98c;
  --text:#fff6ea;
  --text-dim:rgba(255,246,234,0.6);
  --green:#4caf50;
  --red:#ef5350;
  --radius:12px;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text)}

#app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto;background:var(--surface)}

/* Header */
#header{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:rgba(0,0,0,0.3);border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:10;
}
#header h1{flex:1;font-size:18px;font-weight:600;color:var(--amber-soft);letter-spacing:1px}
.header-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:rgba(255,157,61,0.08);color:var(--amber-soft);
  cursor:pointer;display:grid;place-items:center;transition:all 0.2s;
}
.header-btn:hover{background:rgba(255,157,61,0.2)}
#installBtn{display:none}
#installBtn.visible{display:grid}

/* Status */
#statusBar{
  display:none;align-items:center;gap:8px;padding:6px 16px;
  background:rgba(255,157,61,0.05);border-bottom:1px solid var(--border);
  font-size:12px;color:var(--text-dim);
}
#statusBar.visible{display:flex}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.status-dot.online{background:var(--green)}

/* Chat */
#chatArea{
  flex:1;overflow-y:auto;padding:16px;
  display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
#chatArea::-webkit-scrollbar{width:4px}
#chatArea::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.msg{
  max-width:80%;padding:12px 16px;border-radius:var(--radius);
  font-size:15px;line-height:1.5;word-wrap:break-word;
  animation:msgIn 0.3s ease;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;background:rgba(255,157,61,0.15);border:1px solid var(--border);color:var(--amber-soft)}
.msg.alex{align-self:flex-start;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08)}

.loading-dots{display:flex;gap:4px;padding:4px 0}
.loading-dots span{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:bounce 1.2s infinite}
.loading-dots span:nth-child(2){animation-delay:0.2s}
.loading-dots span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:0.4}40%{transform:translateY(-8px);opacity:1}}

/* Quick actions */
#quickActions{
  display:none;padding:0 16px 8px;
}
#quickActions.visible{display:block}
.quick-pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.quick-pill{
  padding:8px 16px;border-radius:20px;border:1px solid var(--border);
  background:rgba(255,157,61,0.08);color:var(--amber-soft);
  font-size:13px;cursor:pointer;transition:all 0.2s;
}
.quick-pill:hover{background:rgba(255,157,61,0.2);border-color:var(--amber)}

/* Input */
#inputBar{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:rgba(0,0,0,0.3);border-top:1px solid var(--border);
  flex-shrink:0;
}
#msgInput{
  flex:1;padding:12px 16px;border-radius:24px;border:1px solid var(--border);
  background:rgba(255,255,255,0.05);color:var(--text);font-size:15px;
  outline:none;transition:border-color 0.2s;
}
#msgInput:focus{border-color:var(--amber)}
#msgInput::placeholder{color:var(--text-dim)}
.send-btn{
  width:44px;height:44px;border-radius:50%;border:none;
  background:var(--amber);color:var(--bg);
  cursor:pointer;display:grid;place-items:center;
  transition:all 0.2s;flex-shrink:0;
}
.send-btn:hover{transform:scale(1.05)}
.send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.stop-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--red);
  background:rgba(239,83,80,0.1);color:var(--red);
  cursor:pointer;display:none;place-items:center;
}
.stop-btn.visible{display:grid}

/* Empty state */
.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;color:var(--text-dim);text-align:center;
  padding:32px;
}
.empty-state .logo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--amber),#9c27b0);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:0.8}}
.empty-state h2{font-size:24px;color:var(--amber-soft);font-weight:600}
.empty-state p{font-size:14px;max-width:280px}

/* Sidebar */
#sidebarOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  z-index:90;display:none;
}
#sidebarOverlay.visible{display:block}
#sidebar{
  position:fixed;top:0;left:0;bottom:0;width:280px;
  background:var(--surface);border-right:1px solid var(--border);
  z-index:100;transform:translateX(-100%);transition:transform 0.3s;
  display:flex;flex-direction:column;
}
#sidebar.open{transform:none}
.sidebar-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px;border-bottom:1px solid var(--border);
}
.sidebar-header h3{font-size:16px;color:var(--amber-soft)}
.sidebar-close{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
  background:transparent;color:var(--text);cursor:pointer;
  display:grid;place-items:center;
}
.sidebar-content{flex:1;overflow-y:auto;padding:12px}
.sidebar-item{
  padding:12px;border-radius:var(--radius);cursor:pointer;
  transition:background 0.2s;margin-bottom:4px;
}
.sidebar-item:hover{background:rgba(255,157,61,0.1)}
.sidebar-item .title{font-size:14px;color:var(--text);margin-bottom:4px}
.sidebar-item .preview{font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-footer{
  padding:12px;border-top:1px solid var(--border);
}
.sidebar-footer button{
  width:100%;padding:10px;border-radius:var(--radius);
  border:1px solid rgba(239,83,80,0.3);background:rgba(239,83,80,0.1);
  color:var(--red);cursor:pointer;font-size:13px;transition:all 0.2s;
}
.sidebar-footer button:hover{background:rgba(239,83,80,0.2)}

/* Settings */
#settingsPanel{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  z-index:200;display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
}
#settingsPanel.visible{display:flex}
.settings-box{
  width:min(400px,90vw);background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:24px;max-height:80vh;overflow-y:auto;
}
.settings-box h2{font-size:18px;color:var(--amber-soft);margin-bottom:16px}
.settings-group{margin-bottom:16px}
.settings-group label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px}
.settings-group input,.settings-group select{
  width:100%;padding:10px 12px;border-radius:var(--radius);
  border:1px solid var(--border);background:rgba(255,255,255,0.05);
  color:var(--text);font-size:14px;outline:none;
}
.settings-group input:focus,.settings-group select:focus{border-color:var(--amber)}
.settings-actions{display:flex;gap:10px;margin-top:16px}
.settings-actions button{
  flex:1;padding:10px;border-radius:var(--radius);
  font-size:14px;cursor:pointer;transition:all 0.2s;
}
.btn-primary{background:var(--amber);border:none;color:var(--bg);font-weight:600}
.btn-primary:hover{opacity:0.9}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-secondary:hover{background:rgba(255,255,255,0.05)}

/* Toast */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 20px;font-size:14px;color:var(--text);
  opacity:0;transition:all 0.3s;z-index:300;pointer-events:none;
}
#toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}

/* Media Viewer */
#mediaViewer{
  position:fixed;inset:0;background:rgba(0,0,0,0.9);
  z-index:400;display:none;align-items:center;justify-content:center;
}
#mediaViewer.visible{display:flex}
#mediaViewer img{max-width:90%;max-height:90%;border-radius:var(--radius)}
.mv-close{
  position:absolute;top:16px;right:16px;width:40px;height:40px;
  border-radius:50%;border:1px solid rgba(255,255,255,0.2);
  background:rgba(0,0,0,0.5);color:#fff;cursor:pointer;
  display:grid;place-items:center;font-size:20px;
}

/* Widget */
.widget{
  background:rgba(255,157,61,0.05);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin:8px 0;
}
.widget-clock{text-align:center}
.widget-clock .time{font-size:48px;font-weight:700;color:var(--amber-soft)}
.widget-clock .date{font-size:14px;color:var(--text-dim);margin-top:4px}

/* Progress bar */
.progress{
  height:4px;background:rgba(255,255,255,0.1);border-radius:2px;
  margin:8px 0;overflow:hidden;
}
.progress-fill{height:100%;background:var(--amber);border-radius:2px;transition:width 0.3s}

/* Responsive */
@media(max-width:400px){
  .msg{max-width:90%;font-size:14px}
  #inputBar{padding:10px 12px}
}
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div id="header">
    <button class="header-btn" id="menuBtn" title="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12h18M3 6h18M3 18h18"/>
      </svg>
    </button>
    <h1>ALEX</h1>
    <button class="header-btn" id="installBtn" title="Installer l'app">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
    <button class="header-btn" id="settingsBtn" title="Paramètres">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Status -->
  <div id="statusBar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Vérification...</span>
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState">
    <div class="logo"></div>
    <h2>Bonjour !</h2>
    <p>Je suis Alex, ton assistant personnel. Demande-moi ce que tu veux !</p>
  </div>

  <!-- Chat -->
  <div id="chatArea"></div>

  <!-- Quick actions -->
  <div id="quickActions">
    <div class="quick-pills">
      <button class="quick-pill" data-msg="Quelle heure est-il ?">🕐 Heure</button>
      <button class="quick-pill" data-msg="Quel temps fait-il ?">🌤 Météo</button>
      <button class="quick-pill" data-msg="Raconte-moi une blague">😄 Blague</button>
      <button class="quick-pill" data-msg="Aide-moi à coder">💻 Coder</button>
    </div>
  </div>

  <!-- Input -->
  <div id="inputBar">
    <button class="header-btn" id="micBtn" title="Micro">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 11a7 7 0 0014 0M12 19v3M9 22h6"/>
      </svg>
    </button>
    <button class="stop-btn" id="stopBtn" title="Arrêter">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="6" y="6" width="12" height="12" rx="2"/>
      </svg>
    </button>
    <input id="msgInput" type="text" placeholder="Écrire à Alex..." autocomplete="off">
    <button class="send-btn" id="sendBtn" title="Envoyer" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<!-- Sidebar -->
<div id="sidebarOverlay"></div>
<div id="sidebar">
  <div class="sidebar-header">
    <h3>Conversations</h3>
    <button class="sidebar-close" id="closeSidebar">✕</button>
  </div>
  <div class="sidebar-content" id="historyList">
    <div style="text-align:center;color:var(--text-dim);padding:20px;font-size:13px">
      Aucune conversation
    </div>
  </div>
  <div class="sidebar-footer">
    <button id="newChatBtn">+ Nouveau chat</button>
    <button id="btnClearHist" style="margin-top:8px;border-color:rgba(239,83,80,0.3);color:var(--red)">🗑 Effacer l'historique</button>
  </div>
</div>

<!-- Settings -->
<div id="settingsPanel">
  <div class="settings-box">
    <h2>⚙️ Paramètres</h2>
    <div class="settings-group">
      <label>URL du serveur</label>
      <input id="cfgUrl" type="url" placeholder="http://192.168.1.10:8765">
    </div>
    <div class="settings-group">
      <label>Statut: <span id="cfgStatus">-</span></label>
    </div>
    <div class="settings-group">
      <label>Modèle: <span id="cfgModel">-</span></label>
      <select id="cfgModelSel"></select>
    </div>
    <div class="settings-group">
      <label>Voix: <span id="cfgMem">-</span></label>
      <select id="cfgVoice"></select>
    </div>
    <div class="settings-group">
      <label>
        <input id="cfgVoiceEnabled" type="checkbox" checked>
        Voix activée
      </label>
    </div>
    <div class="settings-actions">
      <button class="btn-secondary" id="closeSettings">Fermer</button>
      <button class="btn-primary" id="saveSettings">Sauvegarder</button>
    </div>
  </div>
</div>

<!-- Media Viewer -->
<div id="mediaViewer">
  <button class="mv-close" id="mvClose">✕</button>
  <div id="mvContent"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
